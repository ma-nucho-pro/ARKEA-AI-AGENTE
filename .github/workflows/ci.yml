name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: arkea_ai_desktop_odysseus_overlay/requirements-lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: arkea_ai_desktop_odysseus_overlay/desktop/package-lock.json
      - name: Instalar dependencias Python
        working-directory: arkea_ai_desktop_odysseus_overlay
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt pytest
      - name: Verificar dependencias Python
        working-directory: arkea_ai_desktop_odysseus_overlay
        run: python -m pip check
      - name: Ejecutar pruebas
        working-directory: arkea_ai_desktop_odysseus_overlay
        run: python -m pytest -q
      - name: Instalar dependencias Electron
        working-directory: arkea_ai_desktop_odysseus_overlay/desktop
        run: npm ci --no-audit --no-fund
      - name: Auditar dependencias de producción
        working-directory: arkea_ai_desktop_odysseus_overlay/desktop
        run: npm audit --omit=dev
